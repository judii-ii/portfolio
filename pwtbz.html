<head>
    <title>hi xxxxxxx</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Estonia&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Pretendard-Regular';
            src: url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
        }

        @import url('https://fastly.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');
        @import url('https://fonts.cdnfonts.com/css/w95fa');

        body {
            background-image: url('pool.webp');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .centered-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* 왼쪽 정렬 */
            padding: 20px;
            gap: 5px; /* 줄 간격 조절 */
            color: white;
            width: 300px; /* 컨테이너 너비 지정 */
        }

        .centered-container h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 30px;
            text-align: left;
            margin: 0;
        }

        .pretendard-text {
            position: relative;
            cursor: pointer;
            font-family: 'Pretendard-Bold', sans-serif;
            color: black;
            font-size: 15px;
            text-align: left;
            text-decoration: underline;
            margin: 10px 0 0 0;
        }

        .tooltip {
            position: absolute;
            background-color: rgb(255, 255, 225);
            color: black;
            font-family: 'W95FA', sans-serif;
            font-size: clamp(0.8rem, 1vw, 1.2rem);
            padding: 8px 12px;
            border-radius: 8px;
            border-style: solid;
            border-color: black;
            font-size: 14px;
            bottom: 3%;               /* 125%에서 200%로 변경 - 더 위로 */
            left: 360%;
            transform: translateX(-50%);
            white-space: nowrap;
            visibility: visible;
            opacity: 1;
            transition: all 0.3s ease;
        }
        
        .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 30%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: rgb(255, 255, 225) transparent transparent transparent;
        }
        
        /* 호버시 효과: 크기 커지기 + 색상 변화 */
        .pretendard-text:hover .tooltip {
            transform: translateX(-50%) scale(1.1);
            background-color: rgb(255, 255, 180);
            border-color: #ff6b6b;
        }

        /* 다른 호버 효과 옵션들 (원하면 위 효과 대신 사용) */
        
        /* 흔들림 효과 */
        /*
        .pretendard-text:hover .tooltip {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            25% { transform: translateX(-50%) translateY(-2px); }
            75% { transform: translateX(-50%) translateY(2px); }
        }
        */

        /* 펄스 효과 */
        /*
        .pretendard-text:hover .tooltip {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }
        */

        form {
            width: 100%; /* form을 컨테이너 너비에 맞춤 */
        }

        input[type="password"] {
            padding: 5px;
            font-size: 1.2em;
            width: 60%;
            margin-top: 0px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            font-family: 'Instrument Serif', serif;
            font-size: 1em;
            border-style: dotted;
            border-width: 1px; 
            background-color: rgb(61, 98, 95);
            color: white;
            cursor: pointer;
            margin-top: 10px;
            width: 30%; /* 버튼을 form 너비에 맞춤 */
            box-sizing: border-box;
        }

    </style>
</head>
<body>
    <div class="centered-container">
        <h1>hi we're xxxxxxx</h1>
        <p class="pretendard-text">
            password
            <span class="tooltip">password : theboyz</span>
        </p>
        <form>
            <input id="pwd" type="password" placeholder="Ready to?">
            <button type="button" onclick="checkPassword()">connect</button>
        </form>
    </div>
</body>
<script>
    function checkPassword() {
        const passwordInput = document.getElementById("pwd").value;
        
        if (passwordInput === "theboyz") {
            console.log("Password matched. Redirecting...");
            window.location.href = "coding-go.html";
        } else {
            alert("Your dreamm access has been denied");
        }
        
        return false; // 폼이 제출되지 않도록 방지
    }
        // 엔터 키 입력 시 checkPassword 호출
        document.getElementById("pwd").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault(); // 폼의 기본 제출 방지
            checkPassword(); // 비밀번호 확인 함수 호출
        }
    });
</script>
